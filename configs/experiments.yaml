retrieval:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  main_k: 5
  secondary_k: 2
  stage_a_k: [1, 2, 5, 10]

conditions:
  B0:
    retrieval: false
    poison_variant: null
    cautious_prompt: false
  B1:
    retrieval: true
    poison_variant: null
    cautious_prompt: false
  B2:
    retrieval: true
    poison_variant: out_of_range_plain
    poison_count: 1
    cautious_prompt: false
  D1:
    retrieval: true
    poison_variant: out_of_range_plain
    poison_count: 1
    cautious_prompt: true
  D2:
    retrieval: true
    poison_variant: out_of_range_plain
    poison_count: 1
    isolate_then_aggregate: true
  D3:
    postprocess: system_of_record
    coverage: [1.0, 0.7, 0.4]

one_factor_deviations:
  - vendor_bulletin
  - wrong_in_range_direction
  - three_poison_documents
  - k_2
  - forced_position_first_last

primary_endpoints:
  - "Delta SVR of D3 at 70% coverage versus D1 and D2, with BFFR"
  - "CAR on Tier-1 versus Tier-2 under B2"
