name: Race Gemini Backup Upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/gemini-backup-trigger.txt"

permissions:
  contents: write

concurrency:
  group: gemini-backup-upgrade
  cancel-in-progress: false

env:
  OPENAI_COMPAT_BASE_URL: https://openrouter.ai/api/v1
  OPENAI_COMPAT_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENAI_COMPAT_REQUEST_DELAY_S: "0.25"
  BACKUP_MODEL: google/gemini-2.5-flash-lite
  BACKUP_KEY: google_gemini-2.5-flash-lite

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run matched original B2 baseline
        run: |
          mkdir -p "results/$BACKUP_KEY"
          python scripts/run_generation.py \
            --condition B2 \
            --run-label B2_P1 \
            --model "$BACKUP_MODEL" \
            --tier 12 \
            --k 5 \
            --variant out_of_range_plain \
            --poison-count 1 \
            --out "results/$BACKUP_KEY/main_b2_p1.jsonl"
      - name: Stage baseline artifact
        if: always()
        run: |
          mkdir -p "artifact/$BACKUP_KEY"
          test ! -f "results/$BACKUP_KEY/main_b2_p1.jsonl" || cp "results/$BACKUP_KEY/main_b2_p1.jsonl" "artifact/$BACKUP_KEY/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridpoison-gemini-backup-baseline
          path: artifact/
          if-no-files-found: warn
          retention-days: 30

  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run commit-required control
        run: |
          mkdir -p "results/$BACKUP_KEY"
          python scripts/run_upgrade_generation.py \
            --model "$BACKUP_MODEL" \
            --mode commit \
            --out "results/$BACKUP_KEY/upgrade_commit.jsonl"
      - name: Stage commit artifact
        if: always()
        run: |
          mkdir -p "artifact/$BACKUP_KEY"
          test ! -f "results/$BACKUP_KEY/upgrade_commit.jsonl" || cp "results/$BACKUP_KEY/upgrade_commit.jsonl" "artifact/$BACKUP_KEY/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridpoison-gemini-backup-commit
          path: artifact/
          if-no-files-found: warn
          retention-days: 30

  bm25:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run BM25 sensitivity
        run: |
          mkdir -p "results/$BACKUP_KEY"
          python scripts/run_upgrade_generation.py \
            --model "$BACKUP_MODEL" \
            --mode bm25 \
            --out "results/$BACKUP_KEY/upgrade_bm25.jsonl"
      - name: Stage BM25 artifact
        if: always()
        run: |
          mkdir -p "artifact/$BACKUP_KEY"
          test ! -f "results/$BACKUP_KEY/upgrade_bm25.jsonl" || cp "results/$BACKUP_KEY/upgrade_bm25.jsonl" "artifact/$BACKUP_KEY/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridpoison-gemini-backup-bm25
          path: artifact/
          if-no-files-found: warn
          retention-days: 30

  stagec:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run Stage C forced composition
        run: |
          mkdir -p "results/$BACKUP_KEY"
          python scripts/run_upgrade_generation.py \
            --model "$BACKUP_MODEL" \
            --mode stagec \
            --out "results/$BACKUP_KEY/upgrade_stagec.jsonl"
      - name: Stage Stage C artifact
        if: always()
        run: |
          mkdir -p "artifact/$BACKUP_KEY"
          test ! -f "results/$BACKUP_KEY/upgrade_stagec.jsonl" || cp "results/$BACKUP_KEY/upgrade_stagec.jsonl" "artifact/$BACKUP_KEY/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridpoison-gemini-backup-stagec
          path: artifact/
          if-no-files-found: warn
          retention-days: 30

  finalize:
    needs: [baseline, commit, bm25, stagec]
    if: ${{ needs.baseline.result == 'success' && needs.commit.result == 'success' && needs.bm25.result == 'success' && needs.stagec.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: gridpoison-gemini-backup-*
          path: results
          merge-multiple: true
      - name: Verify backup result matrix
        run: |
          test "$(wc -l < results/$BACKUP_KEY/main_b2_p1.jsonl)" -eq 160
          test "$(wc -l < results/$BACKUP_KEY/upgrade_commit.jsonl)" -eq 320
          test "$(wc -l < results/$BACKUP_KEY/upgrade_bm25.jsonl)" -eq 320
          test "$(wc -l < results/$BACKUP_KEY/upgrade_stagec.jsonl)" -eq 400
      - name: Commit Gemini backup results
        run: |
          git config user.name "gridpoisonrag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "results/$BACKUP_KEY/"
          git commit -m "Add Gemini backup final-upgrade results" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
