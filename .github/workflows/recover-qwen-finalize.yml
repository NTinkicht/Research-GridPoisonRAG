name: Recover Qwen and Finalize

on:
  workflow_run:
    workflows: ["Auto Finalize Experiments"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recover-and-finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.id == 37734187264 }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_COMPAT_BASE_URL: https://openrouter.ai/api/v1
      OPENAI_COMPAT_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HOME: /home/runner/.cache/huggingface
      MODEL: qwen/qwen3-8b
      EXPERIMENT_GIT_SHA: f16b9b8f91d7f9303cfd19e56af8ba6baf67414e
      SOURCE_RUN_ID: 37734187264
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2-v1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Require credentials
        run: |
          test -n "$OPENAI_COMPAT_API_KEY" || (echo "Missing OPENROUTER_API_KEY" && exit 1)
          test -n "$HF_TOKEN" || (echo "Missing HF_TOKEN" && exit 1)
      - name: Recover Qwen checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/qwen-recovered results/qwen_qwen3-8b
          gh run download "$SOURCE_RUN_ID" \
            -n "gridpoisonrag-qwen_qwen3-8b-$SOURCE_RUN_ID" \
            -D /tmp/qwen-recovered
          cp -f /tmp/qwen-recovered/*.jsonl results/qwen_qwen3-8b/
          echo "Recovered $(find results/qwen_qwen3-8b -name '*.jsonl' | wc -l) Qwen result files"
      - name: Run only missing Qwen deviations
        run: |
          set -euo pipefail
          DIR="results/qwen_qwen3-8b"
          if [ ! -f "$DIR/dev_wrong_in_range.jsonl" ]; then
            python scripts/run_generation.py --condition B2 --run-label B2_WRONG_IN_RANGE_P1 --model "$MODEL" --tier 12 --k 5 --variant wrong_in_range_plain --poison-count 1 --out "$DIR/dev_wrong_in_range.jsonl"
          fi
          if [ ! -f "$DIR/dev_k2.jsonl" ]; then
            python scripts/run_generation.py --condition B2 --run-label B2_P1_K2 --model "$MODEL" --tier 12 --k 2 --variant out_of_range_plain --poison-count 1 --out "$DIR/dev_k2.jsonl"
          fi
          test "$(find "$DIR" -maxdepth 1 -name '*.jsonl' | wc -l)" -ge 18
      - name: Commit recovered Qwen results
        run: |
          git config user.name "gridpoisonrag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/qwen_qwen3-8b/
          git commit -m "Recover and complete Qwen final experiment results" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Refresh main and verify all three models
        run: |
          git pull --rebase origin main
          DIRS=(
            "results/mistralai_mistral-small-3.2-24b-instruct"
            "results/qwen_qwen3-8b"
            "results/openai_gpt-5.6-luna"
          )
          for D in "${DIRS[@]}"; do
            test -f "$D/main_b2_p3.jsonl" || (echo "Missing completed model results: $D" && exit 1)
          done
      - name: Generate final statistics and adjudication sample
        run: |
          set -euo pipefail
          DIRS=(
            "results/mistralai_mistral-small-3.2-24b-instruct"
            "results/qwen_qwen3-8b"
            "results/openai_gpt-5.6-luna"
          )
          FILES=$(find "${DIRS[@]}" -name '*.jsonl' -type f -print)
          python scripts/statistical_report.py $FILES --out results/analysis_summary.json
          python scripts/sample_adjudication.py $FILES --fraction 0.15 --minimum 300 --out results/adjudication_sample.csv
      - name: Commit aggregate outputs
        run: |
          git config user.name "gridpoisonrag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/analysis_summary.json results/adjudication_sample.csv
          git commit -m "Add final statistical analysis and adjudication sample" || true
          git pull --rebase origin main
          git push origin HEAD:main
