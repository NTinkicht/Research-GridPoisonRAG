name: Build Paper PDF

on:
  push:
    paths:
      - "paper/main.tex"
      - "paper/upgrade_followup.tex"
      - "paper/references.bib"
      - "results/analysis_summary.json"
      - "results/upgrade_analysis.json"
      - "results/stage_a_summary.json"
      - "scripts/render_paper_assets.py"
      - "scripts/analyze_upgrade_results.py"
      - "results/upgrade_retrieval_audit.json"
      - "results/existing_data_upgrade.json"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-paper-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project for generated analysis
        run: python -m pip install -e .
      - name: Render result tables when analysis exists
        run: |
          if [ -f results/analysis_summary.json ]; then
            python scripts/render_paper_assets.py
          fi
          if [ -f results/upgrade_retrieval_audit.json ]; then
            python scripts/analyze_upgrade_results.py
          fi
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
      - name: Enforce six-page submission limit
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          pages = len(PdfReader("paper/main.pdf").pages)
          print(f"Submission PDF pages: {pages}")
          if pages > 6:
              raise SystemExit(f"Paper exceeds six-page limit: {pages} pages")
          PY
      - name: Copy named PDF
        run: cp paper/main.pdf paper/GridPoisonRAG_NEECON2026.pdf
      - name: Package Overleaf project
        run: |
          rm -rf overleaf_project GridPoisonRAG_Overleaf_Project.zip
          mkdir -p overleaf_project
          cp paper/main.tex overleaf_project/
          cp paper/references.bib overleaf_project/
          cp paper/generated_results.tex overleaf_project/
          cp paper/upgrade_followup.tex overleaf_project/
          cp paper/GridPoisonRAG_NEECON2026.pdf overleaf_project/
          (cd overleaf_project && zip -q -r ../GridPoisonRAG_Overleaf_Project.zip .)
      - name: Commit generated paper assets
        run: |
          git config user.name "gridpoisonrag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper/generated_results.tex paper/upgrade_followup.tex results/upgrade_analysis.json paper/GridPoisonRAG_NEECON2026.pdf
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build GridPoisonRAG NEECON paper PDF"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GridPoisonRAG-NEECON2026-PDF
          path: paper/GridPoisonRAG_NEECON2026.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: GridPoisonRAG-Overleaf-Project
          path: GridPoisonRAG_Overleaf_Project.zip
