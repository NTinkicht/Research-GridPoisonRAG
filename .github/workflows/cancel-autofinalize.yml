name: Cancel Accidental Auto Finalize

on:
  push:
    branches:
      - main
    paths:
      - ".github/cancel-autofinalize-trigger.txt"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel accidental auto-finalize run
        run: gh api -X POST repos/NTinkicht/Research-GridPoisonRAG/actions/runs/37975683472/cancel
