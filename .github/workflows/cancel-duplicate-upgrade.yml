name: Cancel Duplicate Upgrade

on:
  push:
    paths:
      - ".github/workflows/cancel-duplicate-upgrade.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate final-upgrade run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/NTinkicht/Research-GridPoisonRAG/actions/runs/37933808635/cancel
