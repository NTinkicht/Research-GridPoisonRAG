name: Recover Qwen Final Upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/qwen-recovery-trigger.txt"

permissions:
  contents: write
  actions: read

concurrency:
  group: qwen-final-upgrade-recovery
  cancel-in-progress: false

env:
  OPENAI_COMPAT_BASE_URL: https://openrouter.ai/api/v1
  OPENAI_COMPAT_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENAI_COMPAT_REQUEST_DELAY_S: "1.0"
  QWEN_MODEL: qwen/qwen3-8b
  QWEN_KEY: qwen_qwen3-8b

jobs:
  qwen-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Validate benchmark and API key
        run: |
          python scripts/validate_benchmark.py
          test -n "$OPENAI_COMPAT_API_KEY" || (echo "Missing repository secret OPENROUTER_API_KEY" && exit 1)
      - name: Recover Qwen commit-required control
        run: |
          mkdir -p "results/$QWEN_KEY"
          python scripts/run_upgrade_generation.py \
            --model "$QWEN_MODEL" \
            --mode commit \
            --out "results/$QWEN_KEY/upgrade_commit.jsonl"
      - name: Stage commit artifact
        if: always()
        run: |
          mkdir -p "artifact/$QWEN_KEY"
          test ! -f "results/$QWEN_KEY/upgrade_commit.jsonl" || cp "results/$QWEN_KEY/upgrade_commit.jsonl" "artifact/$QWEN_KEY/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridpoison-qwen-recovery-commit
          path: artifact/
          if-no-files-found: warn
          retention-days: 30

  qwen-bm25:
    needs: qwen-commit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Recover Qwen BM25 sensitivity
        run: |
          mkdir -p "results/$QWEN_KEY"
          python scripts/run_upgrade_generation.py \
            --model "$QWEN_MODEL" \
            --mode bm25 \
            --out "results/$QWEN_KEY/upgrade_bm25.jsonl"
      - name: Stage BM25 artifact
        if: always()
        run: |
          mkdir -p "artifact/$QWEN_KEY"
          test ! -f "results/$QWEN_KEY/upgrade_bm25.jsonl" || cp "results/$QWEN_KEY/upgrade_bm25.jsonl" "artifact/$QWEN_KEY/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridpoison-qwen-recovery-bm25
          path: artifact/
          if-no-files-found: warn
          retention-days: 30

  qwen-stagec:
    needs: qwen-bm25
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Recover Qwen Stage C
        run: |
          mkdir -p "results/$QWEN_KEY"
          python scripts/run_upgrade_generation.py \
            --model "$QWEN_MODEL" \
            --mode stagec \
            --out "results/$QWEN_KEY/upgrade_stagec.jsonl"
      - name: Stage Stage C artifact
        if: always()
        run: |
          mkdir -p "artifact/$QWEN_KEY"
          test ! -f "results/$QWEN_KEY/upgrade_stagec.jsonl" || cp "results/$QWEN_KEY/upgrade_stagec.jsonl" "artifact/$QWEN_KEY/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gridpoison-qwen-recovery-stagec
          path: artifact/
          if-no-files-found: warn
          retention-days: 30

  finalize:
    needs:
      - qwen-commit
      - qwen-bm25
      - qwen-stagec
    if: ${{ needs.qwen-commit.result == 'success' && needs.qwen-bm25.result == 'success' && needs.qwen-stagec.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download recovered Qwen artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gridpoison-qwen-recovery-*
          path: results
          merge-multiple: true
      - name: Download completed Mistral and Luna artifacts from original run
        run: |
          gh run download 37928683708 \
            -n gridpoison-upgrade-mistralai_mistral-small-3.2-24b-instruct \
            -D results
          gh run download 37928683708 \
            -n gridpoison-upgrade-openai_gpt-5.6-luna \
            -D results
      - name: Verify complete result matrix
        run: |
          test "$(wc -l < results/qwen_qwen3-8b/upgrade_commit.jsonl)" -eq 320
          test "$(wc -l < results/qwen_qwen3-8b/upgrade_bm25.jsonl)" -eq 320
          test "$(wc -l < results/qwen_qwen3-8b/upgrade_stagec.jsonl)" -eq 400
          test "$(wc -l < results/mistralai_mistral-small-3.2-24b-instruct/upgrade_commit.jsonl)" -eq 320
          test "$(wc -l < results/mistralai_mistral-small-3.2-24b-instruct/upgrade_bm25.jsonl)" -eq 320
          test "$(wc -l < results/mistralai_mistral-small-3.2-24b-instruct/upgrade_stagec.jsonl)" -eq 400
          test "$(wc -l < results/openai_gpt-5.6-luna/upgrade_commit.jsonl)" -eq 320
          test "$(wc -l < results/openai_gpt-5.6-luna/upgrade_bm25.jsonl)" -eq 320
          test "$(wc -l < results/openai_gpt-5.6-luna/upgrade_stagec.jsonl)" -eq 400
      - name: Commit complete final-upgrade results
        run: |
          git config user.name "gridpoisonrag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/*/upgrade_*.jsonl
          if git diff --cached --quiet; then
            echo "No recovery result changes to commit"
            exit 0
          fi
          git commit -m "Recover complete Qwen final-upgrade results"
          git pull --rebase origin main
          git push origin HEAD:main
