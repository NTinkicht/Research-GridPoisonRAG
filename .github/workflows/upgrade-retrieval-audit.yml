name: Final Upgrade Retrieval Audit

on:
  push:
    paths:
      - ".github/workflows/upgrade-retrieval-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run retrieval audit
        run: python scripts/run_upgrade_retrieval_audit.py
      - name: Commit audit
        run: |
          git config user.name "gridpoisonrag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/upgrade_retrieval_audit.json
          if git diff --cached --quiet; then
            echo "No retrieval-audit changes to commit"
            exit 0
          fi
          git commit -m "Add final-upgrade retrieval composition audit"
          git pull --rebase origin main
          git push origin HEAD:main
