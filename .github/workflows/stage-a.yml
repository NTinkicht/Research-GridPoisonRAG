name: Stage A Retrieval

on:
  push:
    paths:
      - ".github/workflows/stage-a.yml"
      - "benchmark/items/**"
      - "corpus/**"
      - "scripts/run_stage_a.py"
      - "scripts/summarize_stage_a.py"
      - "src/gridpoisonrag/retrieval.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Run one-poison exposure
        run: python scripts/run_stage_a.py --variant out_of_range_plain --poison-count 1 --out results/stage_a_plain_1.jsonl
      - name: Run three-poison exposure
        run: python scripts/run_stage_a.py --variant out_of_range_plain --poison-count 3 --out results/stage_a_plain_3.jsonl
      - name: Run bulletin framing exposure
        run: python scripts/run_stage_a.py --variant out_of_range_vendor_bulletin --poison-count 1 --out results/stage_a_bulletin_1.jsonl
      - name: Summarize
        run: >-
          python scripts/summarize_stage_a.py
          results/stage_a_plain_1.jsonl
          results/stage_a_plain_3.jsonl
          results/stage_a_bulletin_1.jsonl
          --out results/stage_a_summary.json
      - name: Commit Stage A results
        run: |
          git config user.name "gridpoisonrag-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/stage_a_*.jsonl results/stage_a_summary.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Stage-A retrieval exposure results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
